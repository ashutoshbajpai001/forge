<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Generate QR Codes instantly for URLs, text and more. Free, unlimited, no sign-up required.">
    <title>QR Generator | Forge</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- NAVBAR -->
    <nav class="navbar">
        <div class="logo">
            <a href="index.html">Forge</a>
        </div>
        <div class="search-box">
            <input type="text" placeholder="Search tools...">
        </div>
        <div class="nav-right">
            <button class="login-btn">Login</button>
            <button class="theme-btn" id="themeBtn">
                <i class="fa-solid fa-moon" id="themeIcon"></i>
            </button>
        </div>
    </nav>

    <!-- QR GENERATOR -->
    <section class="hero">

        <h1>QR Code Generator</h1>

        <p>Generate QR Codes instantly for URLs, text and more.</p>

        <div class="hero-search">
            <input
                id="qrInput"
                type="text"
                placeholder="Paste URL or Text...">
            <button id="generateBtn">Generate QR</button>
        </div>

        <!-- ERROR MESSAGE -->
        <p id="errorMessage" class="error-message"></p>

        <!-- QR RESULT -->
        <div id="qrCard" class="qr-result" style="display: none;">
            <img id="qrImage" alt="Generated QR Code">
            <h3>QR Generated Successfully</h3>
            <button id="downloadBtn">
                <i class="fa-solid fa-download"></i>&nbsp; Download PNG
            </button>
        </div>

        <p class="hero-footer">
            Trusted by developers, students and creators.
        </p>

    </section>

    <hr class="divider">

    <!-- FOOTER -->
    <footer class="footer">
        <div class="footer-brand">Forge</div>
        <p>Every digital tool, one platform.</p>
    </footer>

    <script src="script.js"></script>
    <script src="theme.js"></script>

</body>
</html>
