<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Forge</title>

    <!-- Font Awesome -->
    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

    <!-- CSS -->
    <link rel="stylesheet" href="style.css">

</head>

<body>

    <!-- ==========================================
         NAVBAR
    =========================================== -->

    <nav class="navbar">

        <div class="logo">
            Forge
        </div>

        <div class="search-box">

            <input
                type="text"
                placeholder="Search tools...">

        </div>

        <div class="nav-right">

            <button class="login-btn">
                Login
            </button>

            <button class="theme-btn">

                <i class="fa-solid fa-moon"></i>

            </button>

        </div>

    </nav>



    <!-- ==========================================
         HERO SECTION
    =========================================== -->

    <section class="hero">

        <h1>

            Every Digital Tool.
            <br>
            One Platform.

        </h1>

        <p>

            Find, create and automate your digital work in seconds.

        </p>

        <div class="hero-search">

            <input
                type="text"
                placeholder="Search tools...">

            <button>

                Search

            </button>

        </div>

        <div class="popular-tags">

            <span>QR</span>

            <span>PDF</span>

            <span>Image</span>

            <span>AI</span>

        </div>

        <p class="hero-footer">

            Trusted by developers, students and creators.

        </p>

    </section>



    <hr class="divider">



    <!-- ==========================================
         POPULAR TOOLS
    =========================================== -->

    <section class="tools">

        <h2>Popular Tools</h2>

        <!-- Tool Cards will be added here -->

    </section>



    <!-- ==========================================
         FOOTER (Coming Soon)
    =========================================== -->



    <!-- JavaScript -->
    <script src="script.js"></script>

</body>

</html>
